[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogentic-maximin-kite-nash-certificates"
version = "1.0.0"
description = "Constructive Lean 4.35.0 formalization and zero-float exact-Q certificate stack (KITE-NASH-CERT-1.0) for Google Cogentic's exact polynomial-time 1/5-approximate Nash equilibrium algorithm."
authors = [{name = "Lluis Eriksson"}]
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
